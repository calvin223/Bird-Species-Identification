# Inference settings
inference:
  batch_size: 32
  device: "cuda"  # or "cpu"
  num_workers: 0  # Set to 0 for Windows
  use_mixed_precision: true
  max_segments_per_file: 1000  # Maximum segments to process per audio file

# Output settings
output:
  save_predictions: true
  save_confidence_scores: true
  save_model_disagreements: true
  output_dir: "D:\\University\\Comp702\\project\\ensemble model\\outputs"
  verbose: true
